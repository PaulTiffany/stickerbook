id: stickerbook-asione-omega-llm
display_name: StickerBook ASI One for OmegaLLM
description: ASI One inference for the bounded OmegaLLM language loop
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: ASI One API key
    env_vars: [ASIONE_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.asi1.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/lib/swipl/bin/x86_64-linux/swipl

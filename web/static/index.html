<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe8d7">
<title>StickerBook</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<section id="cover-screen" class="screen cover-screen" aria-label="StickerBook title page">
  <button id="cover-enter" class="cover-enter" type="button" aria-label="Open StickerBook">
    <svg id="cover-scene" class="cover-scene" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="cover-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#76c6f0"/>
          <stop offset="100%" stop-color="#e8f5f5"/>
        </linearGradient>
        <linearGradient id="cover-grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a7d576"/>
          <stop offset="100%" stop-color="#4f9e57"/>
        </linearGradient>
        <filter id="cover-paper" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="expanded"/>
          <feFlood flood-color="#fffdf5" result="paper-color"/>
          <feComposite in="paper-color" in2="expanded" operator="in" result="paper"/>
          <feOffset in="expanded" dy="5" result="shadow-shape"/>
          <feGaussianBlur in="shadow-shape" stdDeviation="4" result="shadow-blur"/>
          <feFlood flood-color="#4b453b" flood-opacity=".25" result="shadow-color"/>
          <feComposite in="shadow-color" in2="shadow-blur" operator="in" result="shadow"/>
          <feMerge>
            <feMergeNode in="shadow"/>
            <feMergeNode in="paper"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g id="cover-picture"></g>
      <g id="cover-decor"></g>
    </svg>
    <div class="cover-title" aria-hidden="true">
      <span class="word-sticker">Sticker</span><span class="word-book">Book</span>
    </div>
    <div class="cover-hint" aria-hidden="true">tap anywhere</div>
  </button>

  <button id="adult-hotspot" class="adult-hotspot" type="button"
          aria-label="Responsible adult and developer controls">
    <span aria-hidden="true">⚙</span>
  </button>
</section>

<section id="gallery-screen" class="screen gallery-screen" hidden aria-label="Choose a page">
  <header class="gallery-header">
    <button id="gallery-back" class="round-control" type="button" aria-label="Back to title page">‹</button>
    <div>
      <div class="eyebrow">StickerBook</div>
      <h1>Pick a page</h1>
    </div>
  </header>
  <div id="page-gallery" class="page-gallery"></div>
</section>

<section id="page-creator-screen" class="screen creator-screen" hidden aria-label="Make a page">
  <header class="gallery-header">
    <button id="creator-back" class="round-control" type="button" aria-label="Back to pages">‹</button>
    <div>
      <div class="eyebrow">New page</div>
      <h1>Make a page</h1>
    </div>
  </header>

  <div class="creator-body">
    <label class="upload-card" for="page-upload">
      <input id="page-upload" type="file" accept="image/*" hidden>
      <div id="page-upload-preview" class="upload-preview">
        <span class="upload-plus">+</span>
        <strong>Choose a picture</strong>
        <small>photo or artwork</small>
      </div>
    </label>
    <div class="creator-note">Page saving is not enabled in the public demo yet.</div>
  </div>
</section>

<main id="play-screen" class="screen play-screen" hidden>
  <div id="page-wrap">
    <svg id="page" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="StickerBook page">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bfe3f4"/>
          <stop offset="100%" stop-color="#e8f4f7"/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a8cf87"/>
          <stop offset="100%" stop-color="#7fb166"/>
        </linearGradient>
        <filter id="sticker-paper" x="-45%" y="-45%" width="190%" height="190%"
                color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="expanded"/>
          <feFlood flood-color="#d7d0c5" result="edge-color"/>
          <feComposite in="edge-color" in2="expanded" operator="in" result="edge-shape"/>
          <feOffset in="edge-shape" dy="2.5" result="paper-edge"/>
          <feFlood flood-color="#fffef9" result="paper-color"/>
          <feComposite in="paper-color" in2="expanded" operator="in" result="paper"/>
          <feMerge>
            <feMergeNode in="paper-edge"/>
            <feMergeNode in="paper"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g id="picture" aria-hidden="true"></g>
      <g id="stickers"></g>
      <g id="placement-layer" aria-hidden="true"></g>
    </svg>
  </div>

  <div id="hotbar" class="hotbar" aria-label="My sticker sheet">
    <button id="home-btn" class="hotbar-end home-btn" type="button" aria-label="Back to title page">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 15.5 16 6l11 9.5v10H19v-7h-6v7H5z"/>
      </svg>
    </button>
    <div id="tray-zone" class="tray-zone">
      <div id="tray-items" role="list" aria-label="My stickers"></div>
      <div id="tray-empty" class="tray-empty" hidden>drag stickers here</div>
    </div>
    <button id="library-btn" class="hotbar-end library-btn" type="button" aria-label="Open sticker library">
      <span aria-hidden="true">+</span>
    </button>
  </div>
</main>

<section id="sticker-overlay" class="sticker-overlay" hidden aria-label="Sticker library">
  <button id="library-backdrop" class="library-backdrop" type="button" aria-label="Close sticker library"></button>
  <div class="sticker-library-panel">
    <header class="library-header">
      <div>
        <div class="eyebrow">Sticker library</div>
        <h2>Pick stickers</h2>
      </div>
      <button id="library-close" class="round-control small" type="button" aria-label="Close sticker library">×</button>
    </header>

    <div id="sticker-library-view">
      <div id="sticker-library-grid" class="sticker-library-grid"></div>
    </div>

    <div id="sticker-maker-view" class="sticker-maker-view" hidden>
      <button id="sticker-maker-back" class="maker-back" type="button">‹ stickers</button>
      <label class="upload-card compact" for="sticker-upload">
        <input id="sticker-upload" type="file" accept="image/*" hidden>
        <div id="sticker-upload-preview" class="upload-preview">
          <span class="upload-plus">+</span>
          <strong>Choose your art</strong>
          <small>Sticker Maker will refine this later</small>
        </div>
      </label>
    </div>
  </div>
</section>

<section id="adult-panel" class="adult-panel" hidden aria-label="Responsible adult controls">
  <button id="adult-backdrop" class="adult-backdrop" type="button" aria-label="Close adult controls"></button>
  <div class="adult-card">
    <button id="adult-close" class="round-control small" type="button" aria-label="Close">×</button>
    <div class="eyebrow">Responsible adult / developer</div>
    <h2>StickerBook</h2>
    <p id="adult-world-note"></p>
    <a id="dev-link" href="?dev=1">Developer receipts</a>
  </div>
</section>

<aside id="dev" hidden>
  <div class="row"><span>world</span><span id="world-mode">–</span></div>
  <div class="row"><span>revision</span><span id="revision">–</span></div>
  <div class="row"><span>acting as</span><span id="principal">–</span></div>
  <div id="verdict" class="verdict idle">drag a sticker</div>
  <h2>receipts</h2>
  <ol id="receipts"></ol>
</aside>

<div id="a11y-status" class="sr-only" aria-live="polite"></div>

<script src="static/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e1d5">
<title>StickerBook</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<main id="play">
  <div id="page-wrap">
    <svg id="page" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="A farm page you can put stickers on">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bfe3f4"/>
          <stop offset="100%" stop-color="#e8f4f7"/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a8cf87"/>
          <stop offset="100%" stop-color="#7fb166"/>
        </linearGradient>
        <filter id="sticker-paper" x="-45%" y="-45%" width="190%" height="190%"
                color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="expanded"/>
          <feFlood flood-color="#d7d0c5" result="edge-color"/>
          <feComposite in="edge-color" in2="expanded" operator="in" result="edge-shape"/>
          <feOffset in="edge-shape" dy="2.5" result="paper-edge"/>
          <feFlood flood-color="#fffef9" result="paper-color"/>
          <feComposite in="paper-color" in2="expanded" operator="in" result="paper"/>
          <feMerge>
            <feMergeNode in="paper-edge"/>
            <feMergeNode in="paper"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g id="picture" aria-hidden="true"></g>
      <g id="stickers"></g>
      <g id="placement-layer" aria-hidden="true"></g>
    </svg>
  </div>

  <div id="hotbar" aria-label="Sticker sheet">
    <div id="tray-items" role="list" aria-label="Stickers"></div>
    <button id="menu-btn" type="button" aria-label="Open the book">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M4.5 7.5c4.8-.8 8.3.1 11.5 2.7v14.3c-3.3-2.4-7-3.2-11.5-2.4V7.5Z"/>
        <path d="M27.5 7.5c-4.8-.8-8.3.1-11.5 2.7v14.3c3.3-2.4 7-3.2 11.5-2.4V7.5Z"/>
      </svg>
    </button>
  </div>
</main>

<section id="book-screen" class="sheet" hidden aria-label="Book">
  <header>
    <div class="eyebrow">Book</div>
    <h1 id="book-title">StickerBook</h1>
    <p id="book-subtitle"></p>\n    <p id="world-note" class="world-note" hidden></p>
    <button class="close" type="button" data-close aria-label="Back to the page">×</button>
  </header>
  <div class="sheet-body">
    <h2>Pages</h2>
    <div id="page-list" class="cards"></div>
    <h2>Later</h2>
    <div id="page-soon" class="cards"></div>
  </div>
</section>

<section id="sticker-screen" class="sheet" hidden aria-label="Stickers">
  <header>
    <div class="eyebrow">Sticker sheet</div>
    <h1>Choose a sticker</h1>
    <p>Pick one, then tap the page to place it.</p>
    <button class="close" type="button" data-close aria-label="Back to the page">×</button>
  </header>
  <div class="sheet-body">
    <div id="sticker-list" class="cards sticker-cards"></div>
    <h2>Later</h2>
    <div class="cards">
      <button class="card soon" type="button" disabled>Make a sticker</button>
    </div>
  </div>
</section>

<aside id="dev" hidden>
  <div class="row"><span>world</span><span id="world-mode">–</span></div>
  <div class="row"><span>revision</span><span id="revision">–</span></div>
  <div class="row"><span>acting as</span><span id="principal">–</span></div>
  <div id="verdict" class="verdict idle">drag a sticker</div>
  <h2>receipts</h2>
  <ol id="receipts"></ol>
</aside>

<div id="a11y-status" class="sr-only" aria-live="polite"></div>

<script src="static/app.js"></script>
</body>
</html>

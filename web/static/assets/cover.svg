<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="StickerBook cover with a bird, frog, butterfly and pond">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#77c7f0"/>
      <stop offset="100%" stop-color="#eef9f6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b2dc82"/>
      <stop offset="100%" stop-color="#4f9f58"/>
    </linearGradient>
    <filter id="paper" x="-40%" y="-40%" width="180%" height="180%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="8" result="expand"/>
      <feFlood flood-color="#fffdf5" result="white"/>
      <feComposite in="white" in2="expand" operator="in" result="outline"/>
      <feOffset in="expand" dy="5" result="off"/>
      <feGaussianBlur in="off" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#3f463e" flood-opacity=".28" result="shade"/>
      <feComposite in="shade" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="640" fill="url(#sky)"/>

name: Core and UI checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check browser JavaScript syntax
        run: node --check web/static/app.js

      - name: Test authority kernel
        working-directory: core
        run: python -m unittest discover -s tests

      - name: Test web bridge
        working-directory: web
        run: python -m unittest discover -s tests

      - name: Verify pinned OpenShell integration contract
        run: python openshell/verify.py

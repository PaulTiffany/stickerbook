name: Deploy public mechanical demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate browser JavaScript
        run: node --check web/static/app.js

      - name: Validate public JSON data
        run: |
          python -m json.tool web/static/assets/manifest.json >/dev/null
          python -m json.tool web/static/help.json >/dev/null

      - name: Build public-only artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/static
          cp web/static/index.html _site/index.html
          cp web/static/app.js _site/static/app.js
          cp web/static/style.css _site/static/style.css
          cp web/static/help.json _site/static/help.json
          cp -R web/static/assets _site/static/assets
          rm -f _site/static/assets/README.md
          touch _site/.nojekyll

          # Assets are data only. Keep executable/runtime material out of the
          # public artifact even as the asset library grows.
          if find _site/static/assets -type f \
            ! -name '*.svg' \
            ! -name '*.png' \
            ! -name '*.jpg' \
            ! -name '*.jpeg' \
            ! -name '*.webp' \
            ! -name '*.json' \
            ! -name '*.txt' \
            -print -quit | grep -q .; then
            echo "Unexpected public asset type"
            exit 1
          fi

          # Root deployment remains allow-listed. Everything else must live
          # below static/assets and satisfy the data-only extension gate above.
          unexpected="$(find _site -type f | sort | grep -Ev \
            '^_site/(\.nojekyll|index\.html|static/(app\.js|style\.css|help\.json|assets/.+))
          test -z "$unexpected"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
 || true)"
          test -z "$unexpected"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
 || true)"
          test -z "$unexpected"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
 || true)"
          test -z "$unexpected"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
